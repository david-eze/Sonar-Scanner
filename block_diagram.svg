<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <filter id="shadow-light" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)" rx="8"/>
  <text x="600" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Sonar Scanner — System Block Diagram</text>
  <line x1="300" y1="50" x2="900" y2="50" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Layer 3: PC / Visualizer -->
  <rect x="20" y="70" width="1160" height="190" rx="10" fill="#fdf4ff" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow-light)"/>
  <text x="40" y="95" font-size="14" font-weight="bold" fill="#7e22ce">PC / VISUALIZER LAYER — Python</text>

  <rect x="40" y="110" width="220" height="90" rx="6" fill="#ffffff" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="150" y="134" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b21a8">Serial Data Parser</text>
  <text x="150" y="150" text-anchor="middle" font-size="9" fill="#475569">JSON Stream Reader</text>
  <text x="150" y="165" text-anchor="middle" font-size="9" fill="#475569">921600 baud @ COM3</text>
  <text x="150" y="180" text-anchor="middle" font-size="9" fill="#475569">Real-time Decoding</text>

  <rect x="290" y="110" width="220" height="90" rx="6" fill="#ffffff" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="134" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b21a8">Occupancy Grid</text>
  <text x="400" y="150" text-anchor="middle" font-size="9" fill="#475569">400 × 400 Pixel Grid</text>
  <text x="400" y="165" text-anchor="middle" font-size="9" fill="#475569">Polar to Cartesian Mapping</text>
  <text x="400" y="180" text-anchor="middle" font-size="9" fill="#475569">Fading Trails (decay: 0.98)</text>

  <rect x="540" y="110" width="220" height="90" rx="6" fill="#ffffff" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="650" y="134" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b21a8">DBSCAN Clustering</text>
  <text x="650" y="150" text-anchor="middle" font-size="9" fill="#475569">eps = 0.3, min_samples = 3</text>
  <text x="650" y="165" text-anchor="middle" font-size="9" fill="#475569">Object Detection</text>
  <text x="650" y="180" text-anchor="middle" font-size="9" fill="#475569">Bounding Boxes</text>

  <rect x="790" y="110" width="220" height="90" rx="6" fill="#ffffff" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="900" y="134" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b21a8">Live Visualization</text>
  <text x="900" y="150" text-anchor="middle" font-size="9" fill="#475569">30-60 FPS Rendering</text>
  <text x="900" y="165" text-anchor="middle" font-size="9" fill="#475569">Velocity Vectors</text>
  <text x="900" y="180" text-anchor="middle" font-size="9" fill="#475569">Classification Confidence</text>

  <!-- Layer 2: Firmware -->
  <rect x="20" y="280" width="1160" height="380" rx="10" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow-light)"/>
  <text x="40" y="305" font-size="14" font-weight="bold" fill="#0369a1">FIRMWARE LAYER — ESP32-S3 (FreeRTOS Dual-Core)</text>

  <rect x="40" y="320" width="540" height="320" rx="8" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="310" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#0284c7">Core 0 (APP_CPU) — Sensor Acquisition &amp; Processing</text>

  <rect x="60" y="358" width="220" height="90" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="170" y="382" text-anchor="middle" font-size="11" font-weight="bold" fill="#0c4a6e">Sensor Acquisition</text>
  <text x="170" y="398" text-anchor="middle" font-size="9" fill="#475569">100Hz Sampling Rate</text>
  <text x="170" y="413" text-anchor="middle" font-size="9" fill="#475569">Trigger Pulse (10μs)</text>
  <text x="170" y="428" text-anchor="middle" font-size="9" fill="#475569">Echo Interrupt (ISR)</text>
  <text x="170" y="443" text-anchor="middle" font-size="9" fill="#475569">Time-of-Flight Calculation</text>

  <rect x="60" y="465" width="220" height="90" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="170" y="489" text-anchor="middle" font-size="11" font-weight="bold" fill="#0c4a6e">Extended Kalman Filter</text>
  <text x="170" y="505" text-anchor="middle" font-size="9" fill="#475569">State: [distance, velocity]ᵀ</text>
  <text x="170" y="520" text-anchor="middle" font-size="9" fill="#475569">Constant-Velocity Model</text>
  <text x="170" y="535" text-anchor="middle" font-size="9" fill="#475569">Process Noise Q = 0.1</text>
  <text x="170" y="550" text-anchor="middle" font-size="9" fill="#475569">Measurement Noise R = 0.3</text>

  <rect x="320" y="358" width="240" height="130" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="440" y="382" text-anchor="middle" font-size="11" font-weight="bold" fill="#854d0e">Shared Memory</text>
  <text x="440" y="398" text-anchor="middle" font-size="9" fill="#713f12">SensorData Struct</text>
  <text x="440" y="413" text-anchor="middle" font-size="9" fill="#713f12">distance, velocity</text>
  <text x="440" y="428" text-anchor="middle" font-size="9" fill="#713f12">confidence, angle</text>
  <text x="440" y="443" text-anchor="middle" font-size="9" fill="#713f12">objectClass, classConfidence</text>
  <text x="440" y="458" text-anchor="middle" font-size="9" fill="#713f12">Mutex-Protected</text>
  <text x="440" y="473" text-anchor="middle" font-size="9" fill="#713f12">Semaphore: sensorDataMutex</text>

  <rect x="320" y="505" width="240" height="90" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="440" y="529" text-anchor="middle" font-size="11" font-weight="bold" fill="#0c4a6e">Object Classifier (k-NN)</text>
  <text x="440" y="545" text-anchor="middle" font-size="9" fill="#475569">Feature Vector: 6 dimensions</text>
  <text x="440" y="560" text-anchor="middle" font-size="9" fill="#475569">Euclidean Distance</text>
  <text x="440" y="575" text-anchor="middle" font-size="9" fill="#475569">k = 3 Neighbors</text>
  <text x="440" y="590" text-anchor="middle" font-size="9" fill="#475569">5 Object Classes</text>

  <rect x="620" y="320" width="540" height="320" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="890" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">Core 1 (PRO_CPU) — Motor Control &amp; Telemetry</text>

  <rect x="640" y="358" width="220" height="90" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="750" y="382" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d">Motor Control Task</text>
  <text x="750" y="398" text-anchor="middle" font-size="9" fill="#475569">Sinusoidal Sweep</text>
  <text x="750" y="413" text-anchor="middle" font-size="9" fill="#475569">Amplitude: 90°, Freq: 0.5Hz</text>
  <text x="750" y="428" text-anchor="middle" font-size="9" fill="#475569">LEDC PWM Generation</text>
  <text x="750" y="443" text-anchor="middle" font-size="9" fill="#475569">50Hz PWM, 16-bit Resolution</text>

  <rect x="640" y="465" width="220" height="90" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="750" y="489" text-anchor="middle" font-size="11" font-weight="bold" fill="#854d0e">Shared MotorCommand</text>
  <text x="750" y="505" text-anchor="middle" font-size="9" fill="#713f12">targetAngle</text>
  <text x="750" y="520" text-anchor="middle" font-size="9" fill="#713f12">sweepAmplitude</text>
  <text x="750" y="535" text-anchor="middle" font-size="9" fill="#713f12">sweepFrequency</text>
  <text x="750" y="550" text-anchor="middle" font-size="9" fill="#713f12">sweepEnabled</text>
  <text x="750" y="565" text-anchor="middle" font-size="9" fill="#713f12">Mutex: motorCommandMutex</text>

  <rect x="880" y="358" width="260" height="90" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1010" y="382" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d">Telemetry Streaming</text>
  <text x="1010" y="398" text-anchor="middle" font-size="9" fill="#475569">50Hz JSON Output</text>
  <text x="1010" y="413" text-anchor="middle" font-size="9" fill="#475569">ArduinoJson Library</text>
  <text x="1010" y="428" text-anchor="middle" font-size="9" fill="#475569">Fields: t, d, v, a, c, oc, cc</text>
  <text x="1010" y="443" text-anchor="middle" font-size="9" fill="#475569">Serial Write at 921600 baud</text>

  <rect x="880" y="470" width="260" height="130" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1" filter="url(#shadow)"/>
  <text x="1010" y="492" text-anchor="middle" font-size="10" font-weight="bold" fill="#e2e8f0">JSON Telemetry Format</text>
  <text x="900" y="510" font-size="8" fill="#a8b5c2" font-family="monospace">{"t": 1234567890,</text>
  <text x="900" y="525" font-size="8" fill="#a8b5c2" font-family="monospace"> "d": 1.23,</text>
  <text x="900" y="540" font-size="8" fill="#a8b5c2" font-family="monospace"> "v": 0.05,</text>
  <text x="900" y="555" font-size="8" fill="#a8b5c2" font-family="monospace"> "a": 45.0,</text>
  <text x="900" y="570" font-size="8" fill="#a8b5c2" font-family="monospace"> "c": 0.95,</text>
  <text x="900" y="585" font-size="8" fill="#a8b5c2" font-family="monospace"> "oc": 1,</text>
  <text x="900" y="595" font-size="8" fill="#a8b5c2" font-family="monospace"> "cc": 0.87}</text>

  <!-- Layer 1: Hardware -->
  <rect x="20" y="680" width="1160" height="200" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow-light)"/>
  <text x="40" y="705" font-size="14" font-weight="bold" fill="#475569">PHYSICAL HARDWARE LAYER</text>

  <rect x="40" y="720" width="180" height="100" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="130" y="748" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">POWER SUPPLY</text>
  <text x="130" y="765" text-anchor="middle" font-size="10" fill="#92400e">5V / 2A External Adapter</text>
  <text x="130" y="780" text-anchor="middle" font-size="10" fill="#92400e">LM1117-3.3 Regulator</text>
  <text x="130" y="795" text-anchor="middle" font-size="10" fill="#92400e">5V Rail + 3.3V Rail</text>
  <text x="130" y="810" text-anchor="middle" font-size="10" fill="#92400e">Protection: PTC, TVS, Schottky</text>

  <rect x="260" y="720" width="180" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="748" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">HC-SR04</text>
  <text x="350" y="765" text-anchor="middle" font-size="10" fill="#166534">Ultrasonic Sensor</text>
  <text x="350" y="780" text-anchor="middle" font-size="10" fill="#166534">2cm – 400cm Range</text>
  <text x="350" y="795" text-anchor="middle" font-size="10" fill="#166534">Trigger / Echo Interface</text>
  <text x="350" y="810" text-anchor="middle" font-size="10" fill="#166534">5V, 15mA</text>

  <rect x="480" y="720" width="180" height="100" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2" filter="url(#shadow)"/>
  <text x="570" y="748" text-anchor="middle" font-size="12" font-weight="bold" fill="#9d174d">SG90 SERVO</text>
  <text x="570" y="765" text-anchor="middle" font-size="10" fill="#9d174d">Standard PWM Servo</text>
  <text x="570" y="780" text-anchor="middle" font-size="10" fill="#9d174d">0° – 180° Sweep</text>
  <text x="570" y="795" text-anchor="middle" font-size="10" fill="#9d174d">50Hz PWM Control</text>
  <text x="570" y="810" text-anchor="middle" font-size="10" fill="#9d174d">5V, 500mA Peak</text>

  <rect x="700" y="720" width="240" height="100" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="820" y="748" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">ESP32-S3 DevKitC-1</text>
  <text x="820" y="765" text-anchor="middle" font-size="10" fill="#1e40af">Dual-core Xtensa LX7 @ 240MHz</text>
  <text x="820" y="780" text-anchor="middle" font-size="10" fill="#1e40af">PSRAM (Optional)</text>
  <text x="820" y="795" text-anchor="middle" font-size="10" fill="#1e40af">GPIO5 (Trig), GPIO18 (Echo)</text>
  <text x="820" y="810" text-anchor="middle" font-size="10" fill="#1e40af">GPIO16 (Servo PWM), UART0</text>

  <rect x="980" y="720" width="180" height="100" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070" y="748" text-anchor="middle" font-size="12" font-weight="bold" fill="#4338ca">USB / SERIAL</text>
  <text x="1070" y="765" text-anchor="middle" font-size="10" fill="#4338ca">UART0 (USB Bridge)</text>
  <text x="1070" y="780" text-anchor="middle" font-size="10" fill="#4338ca">921600 Baud</text>
  <text x="1070" y="795" text-anchor="middle" font-size="10" fill="#4338ca">JSON Telemetry</text>

  <!-- Data Flow Arrows -->
  <line x1="350" y1="720" x2="350" y2="610" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="360" y="670" font-size="9" fill="#16a34a" font-weight="bold">Trigger Pulse (GPIO5)</text>
  <line x1="370" y1="720" x2="370" y2="610" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="380" y="685" font-size="9" fill="#16a34a" font-weight="bold">Echo Signal (GPIO18)</text>
  <line x1="570" y1="610" x2="570" y2="720" stroke="#db2777" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="580" y="670" font-size="9" fill="#db2777" font-weight="bold">PWM Signal (GPIO16)</text>

  <!-- Power distribution lines -->
  <line x1="130" y1="820" x2="130" y2="840" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="130" y1="840" x2="350" y2="840" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="350" y1="840" x2="570" y2="840" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="570" y1="840" x2="820" y2="840" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="820" y1="840" x2="820" y2="820" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="640" y="835" text-anchor="middle" font-size="9" fill="#d97706" font-weight="bold">5V Power Rail</text>

  <!-- Core 0 internal flow: Sensor → EKF -->
  <line x1="170" y1="448" x2="170" y2="465" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="180" y="460" font-size="8" fill="#0284c7">raw distance</text>

  <!-- EKF → Shared Memory -->
  <line x1="280" y1="510" x2="320" y2="470" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="285" y="500" font-size="8" fill="#0284c7">filtered state</text>

  <!-- Shared Memory → Classifier -->
  <line x1="440" y1="488" x2="440" y2="505" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="450" y="500" font-size="8" fill="#0284c7">features</text>

  <!-- Shared Memory → Core 1 -->
  <path d="M 560 420 L 600 420 L 600 400 L 640 400" fill="none" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="605" y="415" font-size="8" fill="#ea580c">SensorData</text>

  <!-- MotorCommand → Motor Control -->
  <line x1="750" y1="465" x2="750" y2="448" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="760" y="460" font-size="8" fill="#dc2626">read command</text>

  <!-- Shared Memory → Telemetry -->
  <line x1="860" y1="470" x2="880" y2="410" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="865" y="445" font-size="8" fill="#dc2626">sensor + class data</text>

  <!-- Firmware to PC: Serial JSON -->
  <line x1="1010" y1="358" x2="1010" y2="200" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1025" y="280" font-size="10" font-weight="bold" fill="#6366f1">JSON Telemetry via USB (921600 baud)</text>

  <!-- PC internal flow -->
  <line x1="260" y1="155" x2="290" y2="155" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="155" x2="540" y2="155" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="760" y1="155" x2="790" y2="155" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="20" y="875" width="1160" height="20" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="30" y="889" font-size="9" fill="#64748b">Legend:  </text>
  <rect x="85" y="879" width="12" height="12" fill="#dbeafe" stroke="#2563eb" stroke-width="0.5"/>
  <text x="100" y="889" font-size="9" fill="#64748b">ESP32-S3</text>
  <rect x="170" y="879" width="12" height="12" fill="#dcfce7" stroke="#16a34a" stroke-width="0.5"/>
  <text x="185" y="889" font-size="9" fill="#64748b">Sensor</text>
  <rect x="245" y="879" width="12" height="12" fill="#fce7f3" stroke="#db2777" stroke-width="0.5"/>
  <text x="260" y="889" font-size="9" fill="#64748b">Servo</text>
  <rect x="315" y="879" width="12" height="12" fill="#fef3c7" stroke="#d97706" stroke-width="0.5"/>
  <text x="330" y="889" font-size="9" fill="#64748b">Power</text>
  <rect x="390" y="879" width="12" height="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="0.5"/>
  <text x="405" y="889" font-size="9" fill="#64748b">USB/Serial</text>
  <rect x="485" y="879" width="12" height="12" fill="#fdf4ff" stroke="#c084fc" stroke-width="0.5"/>
  <text x="500" y="889" font-size="9" fill="#64748b">PC/Visualizer</text>
  <rect x="595" y="879" width="12" height="12" fill="#fefce8" stroke="#ca8a04" stroke-width="0.5"/>
  <text x="610" y="889" font-size="9" fill="#64748b">Shared Memory</text>
</svg>