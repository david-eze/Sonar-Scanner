[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -O3
    -ffast-math
    -frename-registers

upload_speed = 921600
monitor_speed = 921600

monitor_filters = esp32_exception_decoder

lib_deps = 
    bblanchon/ArduinoJson@^6.21.3
